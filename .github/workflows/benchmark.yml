name: Benchmark

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target Operating System'
        type: choice
        required: true
        default: 'ubuntu-latest'
        options:
          - 'ubuntu-latest'
          - 'ubuntu-24.04-arm'
          - 'windows-latest'
          - 'windows-11-arm'
          - 'macos-latest'
          - 'macos-15-intel'
          - 'all'
      category:
        description: 'Benchmark Category'
        type: choice
        required: true
        default: 'all'
        options:
          - 'all'
          - 'algorithms'
          - 'collections'
          - 'numeric'
          - 'strings'
          - 'memory'
          - 'crypto'
          - 'bitwise'
      mode:
        description: 'Benchmark Suite Mode'
        type: choice
        required: true
        default: 'comprehensive'
        options:
          - 'comprehensive'
          - 'standard'
      iterations:
        description: 'Benchmark Measurement Iterations'
        type: choice
        required: true
        default: '5'
        options:
          - '3'
          - '5'
          - '10'
      alya_ref:
        description: 'Alya compiler git ref / branch'
        type: string
        required: false
        default: 'develop'
      update_readme:
        description: 'Update README.md with results'
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.os || 'default' }}-${{ github.event.inputs.category || 'all' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  setup:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute OS matrix
        id: set-matrix
        shell: bash
        run: |
          TARGET_OS="${{ inputs.os }}"
          if [ -z "$TARGET_OS" ]; then
            TARGET_OS="ubuntu-latest"
          fi
          if [ "$TARGET_OS" = "all" ]; then
            echo 'matrix={"os":["ubuntu-latest","ubuntu-24.04-arm","windows-latest","windows-11-arm","macos-latest","macos-15-intel"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"os\":[\"$TARGET_OS\"]}" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    name: Benchmark (${{ matrix.os }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout benchmarks repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Alya compiler
        uses: actions/checkout@v7
        with:
          repository: alya-lang/alya
          ref: ${{ inputs.alya_ref || 'develop' }}
          path: alya-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: alya-compiler

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Alya compiler (Release)
        shell: bash
        run: |
          cd alya-compiler
          cargo build --release
          echo "$(pwd)/target/release" >> $GITHUB_PATH

      - name: Verify Alya compiler
        shell: bash
        run: alya --version

      - name: Run cross-language benchmarks
        shell: bash
        run: |
          ARGS="--suite ${{ inputs.mode || 'comprehensive' }} --category ${{ inputs.category || 'all' }} --iterations ${{ inputs.iterations || '5' }}"
          if [ "${{ inputs.update_readme }}" = "true" ] && [ "${{ inputs.category || 'all' }}" = "all" ] && ( [ "${{ matrix.os }}" = "ubuntu-latest" ] || [ "${{ inputs.os }}" != "all" ] ); then
            ARGS="$ARGS --update-readme"
          fi
          bun run cross_lang/runner.ts $ARGS

      - name: Commit and push benchmark results
        if: inputs.update_readme == true && (inputs.category == 'all' || inputs.category == '') && (matrix.os == 'ubuntu-latest' || inputs.os != 'all')
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md state/latest_results.json
          if git diff --staged --quiet; then
            echo "No changes in benchmark results."
          else
            git commit -m "docs(benchmarks): update benchmark results [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi

name: Benchmark

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target Operating System'
        type: choice
        required: true
        default: 'ubuntu-latest'
        options:
          - 'ubuntu-latest'
          - 'ubuntu-24.04-arm'
          - 'windows-latest'
          - 'windows-11-arm'
          - 'macos-latest'
          - 'macos-15-intel'
          - 'all'
      category:
        description: 'Benchmark Category'
        type: choice
        required: true
        default: 'all'
        options:
          - 'all'
          - 'algorithms'
          - 'collections'
          - 'numeric'
          - 'strings'
          - 'memory'
          - 'crypto'
          - 'bitwise'
      mode:
        description: 'Benchmark Suite Mode'
        type: choice
        required: true
        default: 'comprehensive'
        options:
          - 'comprehensive'
          - 'standard'
      iterations:
        description: 'Benchmark Measurement Iterations'
        type: choice
        required: true
        default: '5'
        options:
          - '3'
          - '5'
          - '10'
      alya_ref:
        description: 'Alya compiler git ref / branch'
        type: string
        required: false
        default: 'develop'
      update_readme:
        description: 'Update README.md with results'
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.os || 'default' }}-${{ github.event.inputs.category || 'all' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  setup:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute OS matrix
        id: set-matrix
        shell: bash
        run: |
          TARGET_OS="${{ inputs.os }}"
          if [ -z "$TARGET_OS" ]; then
            TARGET_OS="ubuntu-latest"
          fi
          entry() {
            printf '{"os":"%s","label":"%s","target":"%s"}' "$1" "$2" "$3"
          }
          ALL="$(entry ubuntu-latest 'Linux x64' ''),$(entry ubuntu-24.04-arm 'Linux ARM64' ''),$(entry windows-latest 'Windows x64' ''),$(entry windows-11-arm 'Windows ARM64' ''),$(entry macos-latest 'macOS ARM64' ''),$(entry macos-15-intel 'macOS Intel' '')"
          if [ "$TARGET_OS" = "all" ]; then
            echo "matrix={\"include\":[$ALL]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$(entry "$TARGET_OS" "$TARGET_OS" '')]}" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    name: Benchmark (${{ matrix.label }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout benchmarks repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Alya compiler
        uses: actions/checkout@v7
        with:
          repository: alya-lang/alya
          ref: ${{ inputs.alya_ref || 'develop' }}
          path: alya-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: alya-compiler

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          # Pinned stable: benchmarks must reproduce, not track
          # master (whose std API keeps shifting, e.g. std.io).
          version: 0.14.1

      - name: Setup Nim
        shell: bash
        run: |
          if command -v nim >/dev/null 2>&1; then
            echo "Nim already installed: $(nim --version | head -1)"
          elif [ "$RUNNER_OS" = "Windows" ] && [ "$RUNNER_ARCH" = "ARM64" ]; then
            echo '::warning::No official Nim build for Windows ARM64; Nim columns will render n/a.'
          else
            curl -sSf https://nim-lang.org/choosenim/init.sh -o /tmp/choosenim.sh
            sh /tmp/choosenim.sh -y || echo '::warning::choosenim failed; Nim columns will render n/a.'
            echo "$HOME/.nimble/bin" >> $GITHUB_PATH
          fi
          export PATH="$HOME/.nimble/bin:$PATH"
          command -v nim >/dev/null 2>&1 && nim --version | head -1 || echo '::warning::Nim unavailable; Nim columns will render n/a.'

      - name: Build Alya compiler (Release)
        shell: bash
        run: |
          cd alya-compiler
          cargo build --release
          TARGET_DIR="$(pwd)/target/release"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            TARGET_DIR="$(cygpath -w "$TARGET_DIR")"
            echo "ALYA_COMPILER=$TARGET_DIR\\alya.exe" >> $GITHUB_ENV
          else
            echo "ALYA_COMPILER=$TARGET_DIR/alya" >> $GITHUB_ENV
          fi
          echo "$TARGET_DIR" >> $GITHUB_PATH

      - name: Verify Alya compiler & Toolchain
        shell: bash
        run: |
          alya --version
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "Windows runner detected: ensuring portable GCC toolchain is installed..."
            alya toolchain install || true
            if [ -d "$HOME/.alya/toolchain/bin" ]; then
              TOOLCHAIN_DIR="$(cygpath -w "$HOME/.alya/toolchain/bin")"
              echo "$TOOLCHAIN_DIR" >> $GITHUB_PATH
            fi
          else
            echo "Non-Windows runner detected ($RUNNER_OS): using system compiler ($(which gcc 2>/dev/null || which clang 2>/dev/null))"
          fi

      - name: Run cross-language benchmarks
        shell: bash
        run: |
          ARGS="--suite ${{ inputs.mode || 'comprehensive' }} --category ${{ inputs.category || 'all' }} --iterations ${{ inputs.iterations || '5' }}"
          if [ "${{ inputs.update_readme }}" = "true" ] && [ "${{ inputs.category || 'all' }}" = "all" ] && ( [ "${{ matrix.label }}" = "Linux x64" ] || [ "${{ inputs.os }}" != "all" ] ); then
            ARGS="$ARGS --update-readme"
          fi
          bun run cross_lang/runner.ts $ARGS

      - name: Regression check vs history (advisory)
        if: inputs.category == 'all' || inputs.category == ''
        continue-on-error: true
        shell: bash
        run: bun run cross_lang/runner.ts --suite ${{ inputs.mode || 'comprehensive' }} --category ${{ inputs.category || 'all' }} --check --threshold 25

      - name: Commit and push benchmark results
        if: inputs.update_readme == true && (inputs.category == 'all' || inputs.category == '') && (matrix.label == 'Linux x64' || inputs.os != 'all')
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md state/latest_results.json state/history.jsonl
          if git diff --staged --quiet; then
            echo "No changes in benchmark results."
          else
            git commit -m "docs(benchmarks): update benchmark results [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
